<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>斗龟场 对局录像</title>
<!--
  网页录像播放器 · 入口页（2026-11-08 · server/player/README.md；Caddy 片段 player.caddy 把 /player 与 /player/ 指到这里）。
  主站 iframe 内嵌 https://<域名>/player?match=<对局号>。本页很小、先于 Godot 网页版加载：
    手机浏览器 ⇒「请在小游戏内观看」（不下载游戏资源）；对局号不像样 ⇒「未找到该对局的录像」；
    读 /player/streams/<对局号>/end.json 的 client_version ⇒ 这一版播放器在 ⇒ 跳 /player/<版本>/?match=<对局号>；
      这一版播放器已清掉 ⇒「录像已过期」；
    end.json 404 ⇒ /player/expired/<对局号> 200 ⇒「录像已过期」，否则「未找到该对局的录像」；连不上 ⇒「网络连接失败」+ 重试。
  判据与 Godot 侧 scripts/systems/replay/web_player_core.gd 同一套（字与正则逐字相同，tools/web_player_audit.py 对账）。
-->
<style>
  html, body { margin: 0; height: 100%; background: #0a0e18; color: #fff1d6;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
  .box { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; }
  #msg { font-size: 26px; letter-spacing: 1px; text-align: center; padding: 0 16px; }
  .loading #msg { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.55; } }
  #btn { display: none; min-width: 200px; padding: 12px 32px; font: inherit; font-size: 20px; color: #fff1d6;
    background: #6a3f1c; border: 3px solid #d89a48; border-radius: 0; cursor: pointer; }
  #btn:hover { background: #7d4b22; border-color: #f0b45a; }
  #btn:active { background: #4e2d12; }
</style>
</head>
<body>
<div class="box loading" id="box"><div id="msg">正在载入录像</div><button id="btn" type="button">重试</button></div>
<script>
(function () {
  "use strict";
  var TXT_MOBILE = "请在小游戏内观看";
  var TXT_EXPIRED = "录像已过期";
  var TXT_NOT_FOUND = "未找到该对局的录像";
  var TXT_OFFLINE = "网络连接失败";
  var TXT_LOADING = "正在载入录像";
  var MOBILE_RE = /(android|iphone|ipad|ipod|mobile|harmonyos|windows phone|iemobile|opera mini|blackberry|kindle|silk)/i;
  var UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
  var VER_RE = /^[0-9]{1,6}(\.[0-9]{1,6}){1,3}$/;
  var box = document.getElementById("box");
  var msg = document.getElementById("msg");
  var btn = document.getElementById("btn");

  function show(text, retry) {
    box.className = "box";
    msg.textContent = text;
    btn.style.display = retry ? "inline-block" : "none";
  }
  function isMobile() {
    var ua = navigator.userAgent || "";
    return MOBILE_RE.test(ua) || (ua.indexOf("Macintosh") >= 0 && (navigator.maxTouchPoints || 0) > 1);
  }
  function get(url, method) {
    return fetch(url, { method: method || "GET", cache: "no-store", credentials: "omit" });
  }
  function run() {
    box.className = "box loading";
    msg.textContent = TXT_LOADING;
    btn.style.display = "none";
    if (isMobile()) { show(TXT_MOBILE); return; }
    var q = new URLSearchParams(window.location.search);
    var id = (q.get("match") || "").trim().toLowerCase();
    if (!UUID_RE.test(id)) { show(TXT_NOT_FOUND); return; }
    get("/player/streams/" + id + "/end.json").then(function (r) {
      if (r.status === 404) {
        return get("/player/expired/" + id).then(function (e) {
          if (e.status === 200) { show(TXT_EXPIRED); } else if (e.status === 404) { show(TXT_NOT_FOUND); } else { show(TXT_OFFLINE, true); }
        });
      }
      if (!r.ok) { show(TXT_OFFLINE, true); return; }
      return r.json().then(function (m) {
        var v = String((m && m.client_version) || "");
        if (!VER_RE.test(v)) { show(TXT_NOT_FOUND); return; }
        return get("/player/" + v + "/index.html", "HEAD").then(function (h) {
          if (h.status === 404) { show(TXT_EXPIRED); return; }
          if (!h.ok) { show(TXT_OFFLINE, true); return; }
          window.location.replace("/player/" + v + "/?match=" + encodeURIComponent(id) + (q.get("hop") ? "&hop=1" : ""));
        });
      });
    }).catch(function () { show(TXT_OFFLINE, true); });
  }
  btn.addEventListener("click", run);
  run();
})();
</script>
</body>
</html>
