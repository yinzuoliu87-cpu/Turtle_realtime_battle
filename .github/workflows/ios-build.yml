# iOS未签名IPA云端构建(2026-07-17 用户"iOS包用线连手机·你开始吧")
# 路线: macOS runner → Godot headless导出Xcode工程(export_project_only) → xcodebuild免签编译 → 打包unsigned IPA artifact
# 用户侧: Actions页下载 turtle-ios-v<版本> (或 Release「ios-latest」里的 turtle-v<版本>.ipa) → Windows装Sideloadly → iPhone USB连电脑 → 拖入IPA用AppleID签名安装
#         → 手机 设置→通用→VPN与设备管理→信任自己的AppleID证书。免费证书7天过期, 重签即可(存档不丢)。
# 构建=debug模板: OS.is_debug_build()=true → 调试场按钮出现; REVIEW_DEMO_DEFAULT=false → 正常匹配不被劫持。
name: iOS unsigned IPA

on:
  # ★★2026-09-20 改成【只在打 tag 时出包】, 不再每次 push main 都跑(用户点头:「对, 可以这样改」)。
  #
  # 为什么改 —— 是为了**仓库转 private 之后还用得起 CI**。算过的账(实测, 不是估的):
  #   · 公开仓库: Actions 标准 runner **免费无限**(所以现在 billable 全是 0)。
  #   · 私有仓库 Free 档: **2000 分钟/月**, 而 **macOS 的分钟按约 10× 计**
  #     (GitHub 官方价: Linux 2-core $0.006/min vs macOS $0.062/min)。
  #   · 本仓实测单次 push: 提交门禁(ubuntu) **18.5 分** + iOS(macOS) **3.3 分**
  #     ⇒ 私有计费 18.5 + 3.3×10 = **约 51.5 分钟/次 push** ⇒ 2000 分钟只够 **约 38 次 push/月**。
  #   · 把 iOS 挪到 tag 上之后, 平时 push 只花 ~18.5 分 ⇒ **约 108 次 push/月**, 才够日常用。
  #
  # ⚠ 代价写在明处: **平时 push 不再自动出 IPA**。要装机包就打 tag ——
  #   本项目本来每升一次版本号就要打 tag(CLAUDE.md §2.5), 所以这两件事天然重合, 不是额外负担。
  #   临时想出一个包又不想升版本: 用 workflow_dispatch 手动跑。
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 失败时把构建日志推到ci-logs分支(本地无token读不了Actions日志API·git拉分支即可看)

jobs:
  build-ios:
    runs-on: macos-latest   # Xcode 15.4链接libgodot.a报swift_Builtin_float缺失(Godot 4.6模板=Swift 6工具链编的)→要新Xcode
    timeout-minutes: 40
    env:
      GODOT_VERSION: "4.6.3-stable"
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode on image
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Download Godot (macOS)
        run: |
          curl -fL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip"
          unzip -q godot.zip
          echo "GODOT=$PWD/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      - name: Install export templates
        run: |
          curl -fL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          TPL_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION/-stable/.stable}"
          mkdir -p "$TPL_DIR"
          unzip -q templates.tpz -d /tmp/tpl
          cp -R /tmp/tpl/templates/. "$TPL_DIR/"
          ls "$TPL_DIR" | head

      - name: Import project resources
        run: |
          "$GODOT" --headless --import --path . || true

      - name: Export iOS Xcode project (debug, project only)
        run: |
          mkdir -p build/ios
          "$GODOT" --headless --export-debug "iOS" "$PWD/build/ios/turtle.ipa" --path .
          echo "--- exported files ---"
          find build/ios -maxdepth 2 | head -40

      - name: Build .app without codesign
        run: |
          set -o pipefail
          cd build/ios
          PROJ=$(ls -d *.xcodeproj | head -1)
          echo "project=$PROJ" | tee diag.log
          xcodebuild -list -project "$PROJ" 2>&1 | tee -a diag.log || true
          xcodebuild -project "$PROJ" -alltargets -configuration Debug -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$PWD/out" build 2>&1 | tee xcodebuild.log
          echo "--- built ---"
          ls out

      - name: Push logs to ci-logs branch on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/logrepo && mkdir /tmp/logrepo && cd /tmp/logrepo
          git init -q -b ci-logs
          cp "$GITHUB_WORKSPACE"/build/ios/*.log . 2>/dev/null || echo "no logs captured" > note.txt
          tail -c 200000 xcodebuild.log > xcodebuild.tail.log 2>/dev/null || true
          git add -A
          git -c user.name=ci -c user.email=ci@ci commit -qm "ci logs run#${GITHUB_RUN_NUMBER}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs

      # ★★2026-09-20 用户:「ipa命名你又不会了吗」——
      #   此前文件名与 artifact 名**两处都写死** `turtle-ios-unsigned`, 一个版本号都没有。
      #   这直接违背 CLAUDE.md §2.5 自己写的那句:
      #   「版本号的全部价值在于**测试者报 bug 时能说清是哪个版本**」——
      #   手机上装了三个包全叫同一个名字, 那句话就落空了。
      # ★版本号从 `project.godot` 取(**单一事实源**), 不从 tag 取:
      #   tag 只在 tag 触发时有; `workflow_dispatch` 手动跑时 ref_name 是分支名, 会得到 "main"。
      - name: Read version (单一事实源 = project.godot)
        id: ver
        run: |
          V=$(grep -m1 '^config/version=' project.godot | cut -d'"' -f2)
          # ★分母: 取不到就当场红。没有这条的话会静默产出一个 `turtle-v.ipa`,
          #   而那种包装到手机上比没有版本号更糟 —— 它看起来像是有版本号的。
          if [ -z "$V" ]; then
            echo "[FAIL] 从 project.godot 读不到 config/version"; exit 1
          fi
          case "$V" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "[FAIL] 版本号形状不对: '$V'"; exit 1 ;;
          esac
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "读到版本号 $V"

      - name: Pack unsigned IPA
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          cd build/ios
          APP=$(ls -d out/*.app | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "turtle-v${VER}.ipa" Payload
          ls -la "turtle-v${VER}.ipa"
          # ★分母: 包真的建出来且不是空壳(免签 .app 打包失败时 zip 也会产出一个几 KB 的文件)
          SZ=$(stat -f%z "turtle-v${VER}.ipa" 2>/dev/null || stat -c%s "turtle-v${VER}.ipa")
          echo "包大小 $SZ 字节"
          if [ "$SZ" -lt 10000000 ]; then
            echo "[FAIL] IPA 只有 $SZ 字节 —— 太小了, 多半是 .app 没打进去"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: turtle-ios-v${{ steps.ver.outputs.version }}
          path: build/ios/turtle-v${{ steps.ver.outputs.version }}.ipa
          retention-days: 14

      # ★发布到 Release「ios-latest」(用户2026-07-24: 要能自动下到桌面)。
      #   Release 资产【公开可下载·不需登录/token】, 而 artifact 需要 GitHub 认证才能下 →
      #   本地无 token 只能靠 Release 拿包。每次构建覆盖同名资产, 永远是最新。
      - name: Publish IPA to Release (公开可下载)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          gh release create ios-latest --title "iOS unsigned (latest)" \
            --notes "自动构建 unsigned IPA · Sideloadly 装机(免费证书7天)。打 tag 时出包, 文件名带版本号。" \
            2>/dev/null || true
          # ★★文件名带版本号之后, 老资产不会被 --clobber 顶掉(名字不一样了) ⇒ 会越堆越多。
          #   ⇒ 传新的之前先把 release 里其它 .ipa 删掉, 只留当前这一个。
          #   这样既能一眼看出版本, 又不会让一个 release 堆几十个 132MB 的包。
          for OLD in $(gh release view ios-latest --json assets \
                        --jq '.assets[].name' 2>/dev/null | grep '\.ipa$' || true); do
            if [ "$OLD" != "turtle-v${VER}.ipa" ]; then
              echo "删掉旧资产 $OLD"
              gh release delete-asset ios-latest "$OLD" -y 2>/dev/null || true
            fi
          done
          # ★2026-08-20 加重试: 连着 push 几个提交时会有**两次构建并发抢同一个 ios-latest**,
          #   后到的那次 `--clobber` 撞上前一次正在写 ⇒ 整个 run 红, 而产物其实是对的。
          #   (那次实测: 失败的是先到的, 后到的传成功, release 上是最新包。)
          #   ⇒ 重试三次, 每次间隔 15 秒; 三次都不行才真的红。
          for i in 1 2 3; do
            if gh release upload ios-latest "build/ios/turtle-v${VER}.ipa" --clobber; then
              echo "上传成功(第 $i 次): turtle-v${VER}.ipa"; break
            fi
            echo "第 $i 次上传失败(多半是并发抢同一个 release), 15 秒后重试"; sleep 15
            if [ "$i" = "3" ]; then exit 1; fi
          done
